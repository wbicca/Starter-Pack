# Codex configuration — minimal. Models are NOT pinned at this stage; subagents inherit
# the session configuration when appropriate. max_depth = 1 prevents recursive fan-out.
# No MCPs, no broad permissions, no unrestricted access are enabled here.

[agents]
max_threads = 4
max_depth = 1

[agents.backend-engineer]
config_file = "agents/backend-engineer.toml"
description = "Implements backend / API logic and services for one well-scoped task, with tests."

[agents.frontend-engineer]
config_file = "agents/frontend-engineer.toml"
description = "Implements frontend behavior and UI logic for one well-scoped task, with tests."

[agents.code-reviewer]
config_file = "agents/code-reviewer.toml"
description = "Reviews a diff for correctness, regressions, and quality. Read-only — never edits code."

[agents.security-auditor]
config_file = "agents/security-auditor.toml"
description = "Audits changes for security issues. Read-only — never edits code."
