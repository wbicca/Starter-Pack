# Project CI — seeded by the Starter Pack's project-onboarding skill.
# Runs the SAME deterministic verifier the quality-gate uses locally
# (scripts/quality/batch-verify.mjs) plus the hygiene quick-check — one rail,
# local and remote.
#
# Adjust to the project's stack:
#   - setup-node fits Node projects; swap/add setup-python etc. as the stack needs.
#   - Uncomment the Install step with the Install command from docs/STACK.md — the
#     quality commands usually need dependencies.
#
# COST (private repos pay per runner-minute; the clock counts PER JOB, not per run):
#   - paths-ignore below skips CI for doc-only commits (edit BOTH lists — the GitHub
#     workflow parser does NOT expand YAML anchors/aliases).
#     ⚠️ If a required status check + branch protection is enabled, a docs-only PR never
#        produces the check and can't merge — add a same-named dummy job or drop the rule.
#   - concurrency cancels a superseded run on the same ref (cheap verify only).
#   - timeout-minutes caps a hung job before it burns the whole monthly allowance.
#   - An expensive integration suite belongs in its own PR-only job — see the commented
#     template at the bottom, and keep its rationale IN this file.
#   - "Card on file != spending limit raised": Actions spending limit defaults to $0 even
#     with a valid card. A job that "fails" in ~3s with no failing step / empty steps /
#     BlobNotFound logs = quota exhausted, NOT a code bug — check Settings -> Billing ->
#     Spending limit on the ACCOUNT before diagnosing code.
name: Project CI

on:
  push:
    branches: [main, master]
    paths-ignore: # keep in sync with the pull_request list below (no YAML anchors)
      - "docs/**"
      - "**/*.md"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE.md"
  pull_request:
    paths-ignore: # keep in sync with the push list above (no YAML anchors)
      - "docs/**"
      - "**/*.md"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE.md"

# Cancel a superseded run on the same ref — safe for the stateless verify job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a stuck job otherwise burns the whole allowance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # batch-verify --range needs history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm # dependency cache (swap to pnpm/yarn per the stack)
      # - name: Install dependencies
      #   run: <Install command from docs/STACK.md, e.g. npm ci>
      - name: Batch verify (docs/STACK.md quality commands)
        run: node scripts/quality/batch-verify.mjs --range "origin/${{ github.event.repository.default_branch }}"
      - name: Quick check (hygiene & secrets)
        run: node scripts/quality/quick-check.mjs

