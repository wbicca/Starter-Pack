name: Starter CI

# Guards the starter's own integrity: structural doctor, hook regression smoke,
# and the shared quick check. All read-only, no dependencies beyond Node.
#
# Cost: private repo → pays per runner-minute, and the clock counts PER JOB (the
# ubuntu+windows matrix is two jobs). The smokes/doctor validate scripts, hooks, and
# structure — a change confined to the paths below cannot alter their outcome, so
# skip CI there. (Edit BOTH lists — the workflow parser does NOT expand YAML anchors.)
on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE.md"

# Supersede an in-flight run on the same ref (the smokes are stateless).
concurrency:
  group: starter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # a hung job otherwise burns the whole allowance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Starter doctor (structure & governance)
        run: node scripts/quality/starter-doctor.mjs
      - name: Quick check (hygiene & secrets)
        run: node scripts/quality/quick-check.mjs
      - name: Quick-check smoke tests
        # POSIX temp-fixture assumptions, same rationale as the other smokes.
        if: runner.os != 'Windows'
        run: node scripts/quality/quick-check-smoke.mjs
      - name: Hook smoke tests (regression suite)
        # POSIX-path assertions (e.g. /tmp whitelist) are meaningless on Windows;
        # the doctor above already validates structure there.
        if: runner.os != 'Windows'
        run: node scripts/quality/hook-smoke.mjs
      - name: Batch-verify smoke tests
        # Same rationale as hook-smoke: POSIX/shell-quoting assumptions; the doctor
        # validates structure on Windows.
        if: runner.os != 'Windows'
        run: node scripts/quality/batch-verify-smoke.mjs
      - name: Update-from-template smoke tests (remote validation)
        # POSIX path assumptions (file:// bare fixtures under /tmp).
        if: runner.os != 'Windows'
        run: node scripts/quality/update-smoke.mjs
